# Prism — Coker Labs
# Served only under Access-covered /in* paths. Do not attach a custom
# domain at the unprotected root of cokerlabs.dev or justincoker.com.

name = "prism"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-09-12"
account_id = "0e0af031cb3281109b1c9846565a159a"

# The public *.workers.dev hostname is disabled. Prism is reachable only
# via Cloudflare Access on cokerlabs.dev/in* and justincoker.com/in*.
workers_dev = false

# Nested Vite output: apps/web/dist/in/prism/** → https://host/in/prism/
# Worker-first so `/` cannot fall through to an SPA shell. The app is
# served only under /in/prism/; everything else is 404.
[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
run_worker_first = true

# D1 — binding DB / database_name prism
[[d1_databases]]
binding = "DB"
database_name = "prism"
database_id = "b856e8c3-c21e-4c22-98c7-957958d4a58f"

# Secret (wrangler secret put): FRED_API_KEY
# Optional at build. Series routes return "Data source unavailable" if missing.

# Optional KV response cache. Without it, the Worker uses an in-memory TTL cache.
# [[kv_namespaces]]
# binding = "CACHE"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Routes — Access-covered /in* paths only. Base path is /in/prism/.
# Primary host:
[[routes]]
pattern = "cokerlabs.dev/in/prism*"
zone_name = "cokerlabs.dev"

# Same-path host:
[[routes]]
pattern = "justincoker.com/in/prism*"
zone_name = "justincoker.com"

# Do not add:
#   pattern = "cokerlabs.dev/*"
#   pattern = "justincoker.com/*"
#   a custom domain on the Worker that points at unprotected `/`.
#   workers_dev = true (public root app)
